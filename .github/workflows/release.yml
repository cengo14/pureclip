name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Etiket atmadan derlemeyi denemek için (yayınlama adımı atlanır).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # AppIcon.icon (Icon Composer) ve NSGlassEffectView macOS 26 SDK'sı gerektirir.
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Araç zinciri
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build (Release)
        working-directory: native
        run: |
          xcodebuild \
            -project PureClip.xcodeproj \
            -scheme PureClip \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package DMG
        working-directory: native
        run: |
          APP="build/Build/Products/Release/PureClip.app"
          test -d "$APP" || { echo "PureClip.app bulunamadı"; exit 1; }

          # Etiketle tetiklendiyse sürüm adı etiket, elle tetiklendiyse kısa SHA.
          VERSION="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) VERSION="${GITHUB_SHA::7}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications

          hdiutil create -volname PureClip \
            -srcfolder dmg \
            -ov -format UDZO \
            "PureClip-${VERSION}.dmg"

          ditto -c -k --keepParent "$APP" "PureClip-${VERSION}.zip"
          ls -lh PureClip-${VERSION}.*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureClip-${{ env.VERSION }}
          path: |
            native/PureClip-*.dmg
            native/PureClip-*.zip

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/PureClip-*.dmg
            native/PureClip-*.zip
          body: |
            PureClip ${{ github.ref_name }}

            > Bu derleme imzasız ve noter onaysızdır. İlk açılışta macOS uyarı
            > verirse uygulamaya sağ tıklayıp **Aç**'ı seçin.
